name: Release
on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout
        uses: actions/checkout@v6
        
      # Set up Node.js with caching for faster installs
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      # Install dependencies including semantic-release plugins
      - name: Install dependencies
        run: npm ci

      # Tun semantic-release to determine the next version and publish the release
      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v8
        with:
          semantic_version: 24
            # You can specify specifying version range for the extra plugins if you prefer.
          extra_plugins: |
            @semantic-release/changelog@6.0.0
            @semantic-release/git
            @semantic-release/github
            @semantic-release/release-notes-generator
          # you can set branches for semantic-release v20 or above.
          branches: |
            [
              '+([0-9])?(.{+([0-9]),x}).x',
              'main',
              'next',
              'next-major',
              {name: 'beta', prerelease: true},
              {name: 'alpha', prerelease: true}
            ]
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
